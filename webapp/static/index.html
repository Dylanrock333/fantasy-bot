<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <main class="chat-pane">
    <header class="chat-header">
      <span>Fantasy Agent</span>
      <div class="chat-header-actions">
        <button id="toggleTrace" title="Show or hide the graph trace">Hide trace</button>
        <button id="newChat" title="Clear conversation">New chat</button>
      </div>
    </header>
    <div id="chat" class="chat"></div>
    <form id="composer" class="composer">
      <input id="input" autocomplete="off" placeholder="Ask about your league..." />
      <button type="submit">Send</button>
    </form>
  </main>
  <aside class="trace-pane">
    <header class="trace-header">
      <span>Graph Trace</span>
      <button id="clearTrace" title="Clear trace log">Clear</button>
    </header>
    <div id="trace" class="trace"></div>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
